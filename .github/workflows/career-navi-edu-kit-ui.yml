name: Career Navi edu-kit UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  adjust:
    if: "!contains(github.event.head_commit.message, 'Career Navi: edu-kit UI')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply tablet-first UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '</style>'
          css = r'''
          /* edu-kit style: tablet-first learning UI */
          :root{--bg:#f3f8f5;--paper:#fff;--ink:#21342a;--muted:#63756b;--line:#d7e4dd;--green:#45a86f;--dark:#255f40;--mint:#e2f5e9;--yellow:#fff4cf;--blue:#eaf5fb;--shadow:0 6px 20px rgba(33,72,49,.06)}
          html{scroll-padding-top:76px}
          body{background:linear-gradient(180deg,#f5faf7 0%,#eef6f1 100%);line-height:1.6}
          .app{max-width:1280px;padding:12px 22px 56px}
          .top{position:sticky;top:0;z-index:20;margin:0 -22px 16px;padding:10px 22px;background:rgba(245,250,247,.94);backdrop-filter:blur(12px);border-bottom:1px solid rgba(215,228,221,.9)}
          .brand{font-size:18px}
          .mark{width:38px;height:38px;border-radius:12px}
          .btn{min-height:42px;padding:9px 14px;border-radius:12px}
          .hero{border-radius:24px;padding:22px 24px;box-shadow:var(--shadow)}
          .heroGrid{grid-template-columns:minmax(0,1.35fr) minmax(240px,.65fr);gap:18px}
          .hero img{height:175px}
          h1{font-size:clamp(34px,4.2vw,50px);margin:10px 0}
          .desc{max-width:760px;margin-bottom:14px}
          .q{padding:12px 15px}
          .progress{margin-top:11px;padding:11px 14px}
          .section{margin:22px 0 10px}
          .section h2{font-size:22px}
          .steps{grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
          .step{min-height:76px;padding:10px 8px;display:flex;flex-direction:column;justify-content:center;transition:.15s}
          .step:active{transform:translateY(1px)}
          .num{width:30px;height:30px}
          .step b{font-size:12px}
          .lessons{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
          .lesson{border-radius:16px;overflow:hidden}
          .lesson.open{grid-column:1/-1}
          .head{min-height:76px;padding:12px 14px;grid-template-columns:auto 1fr auto;gap:11px}
          .no{width:42px;height:42px;border-radius:12px}
          .title{font-size:16px;line-height:1.35}
          .meta{font-size:11px;margin-top:1px}
          .chev{font-size:18px}
          .body{padding:0 16px 16px}
          .grid{grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
          .box{border-radius:14px;padding:13px}
          .guide{padding:13px;margin-top:11px}
          .ai-mini{padding:13px;border-radius:14px}
          .sites{padding:13px;border-radius:14px}
          .siteList{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
          .site{min-height:44px;align-items:center;justify-content:center;text-align:center;padding:8px 9px}
          .tip{margin-top:11px;padding:10px 12px}
          .tip img{width:46px;height:46px}
          .doneRow{margin-top:10px}
          .explore,.aiBlock,.sources{border-radius:18px;padding:17px;margin-top:20px;box-shadow:var(--shadow)}
          .jobs{grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
          .job{padding:11px;border-radius:13px}
          /* AIは5〜7時間の学習カード内に置く */
          .aiBlock{display:none}
          /* 全体の参考リンクは残しつつ、授業中はコンパクトに */
          .sources{padding:14px 16px}
          .sources .links{gap:7px}
          .sources .link{min-height:40px;align-items:center}
          @media(max-width:1100px){
            .app{padding-left:16px;padding-right:16px}
            .top{margin-left:-16px;margin-right:-16px;padding-left:16px;padding-right:16px}
            .heroGrid{grid-template-columns:1fr 260px}
            .hero img{height:150px}
            .jobs{grid-template-columns:repeat(3,minmax(0,1fr))}
          }
          @media(max-width:820px){
            .steps{grid-template-columns:repeat(3,minmax(0,1fr))}
            .heroGrid{grid-template-columns:1fr}
            .hero img{display:none}
            .jobs{grid-template-columns:repeat(2,minmax(0,1fr))}
          }
          @media(max-width:620px){
            .app{padding:10px 12px 48px}
            .top{margin-left:-12px;margin-right:-12px;padding-left:12px;padding-right:12px}
            .hero{padding:18px;border-radius:20px}
            .steps{grid-template-columns:repeat(2,minmax(0,1fr))}
            .lessons{grid-template-columns:1fr}
            .lesson.open{grid-column:auto}
            .grid{grid-template-columns:1fr}
            .siteList{grid-template-columns:1fr}
          }
          @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
          '''
          if css.strip() in s:
              raise SystemExit('already applied')
          if marker not in s:
              raise SystemExit('style marker not found')
          s = s.replace(marker, css + '\n' + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Career Navi: edu-kit UI"
          git rm .github/workflows/career-navi-edu-kit-ui.yml
          git commit -m "chore: remove temporary edu-kit UI workflow"
          git push
