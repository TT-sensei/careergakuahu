name: Career Navi adjustment
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  adjust:
    if: "!contains(github.event.head_commit.message, 'Career Navi: 小学生向け調整')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adjust index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('6年生・中学生', '6年生・小学生')
          s = s.replace('中学生にもわかるようにヒントをください。', '小学生にもわかるようにヒントをください。')
          old = '''</div></div><div class="tip"><img src="${NAVI[l[4]]||NAVI.nami}" alt="ナビキャラ">'''
          new = '''</div></div>${[5,6,7].includes(i+1)?`<div class="sites"><h4>🔎 この時間で使う調べ学習リンク</h4><div class="siteList"><a class="site" href="https://shingaku.mynavi.jp/cnt/etc/zukan/" target="_blank" rel="noopener">マイナビ｜仕事図鑑 ↗</a><a class="site" href="https://kids.gakken.co.jp/shinro/" target="_blank" rel="noopener">学研キッズネット｜進路 ↗</a><a class="site" href="https://shigoto.mhlw.go.jp/" target="_blank" rel="noopener">厚生労働省｜job tag ↗</a><a class="site" href="https://www.13hw.com/" target="_blank" rel="noopener">13歳のハローワーク ↗</a></div></div>`:''}<div class="tip"><img src="${NAVI[l[4]]||NAVI.nami}" alt="ナビキャラ">'''
          if old not in s:
              raise SystemExit('target block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/career-navi-adjust.yml
          git commit -m "Career Navi: 小学生向け調整"
          git rm .github/workflows/career-navi-adjust.yml
          git commit -m "chore: remove temporary adjustment workflow"
          git push
