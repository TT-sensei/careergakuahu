name: Career Navi expand job seeds
on:
  push:
    paths:
      - '.github/workflows/career-navi-expand-jobs.yml'
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand career seed explorer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          new = r'''<section class="explore">
          <h2>🌱 仕事の種を探そう</h2>
          <p class="sub">「仕事の名前」から探してもいいし、「好き」「得意」「やってみたい」から探してもOK。気になるものを見つけてみよう。</p>

          <div class="seedIntro">
            <div class="seedIntroHead"><span>🔎 まずは、どこから探す？</span><small>正解はありません</small></div>
            <div class="seedWays">
              <div class="seedWay"><span class="seedIcon">💛</span><div><b>好きなことから</b><small>ゲーム・動物・音楽・車…</small></div></div>
              <div class="seedWay"><span class="seedIcon">⭐</span><div><b>得意なことから</b><small>話す・考える・つくる・調べる…</small></div></div>
              <div class="seedWay"><span class="seedIcon">🚀</span><div><b>したいことから</b><small>助けたい・守りたい・発明したい…</small></div></div>
              <div class="seedWay"><span class="seedIcon">🏫</span><div><b>身近な場所から</b><small>学校・病院・お店・工場・町…</small></div></div>
            </div>
          </div>

          <div class="seedMapHead"><span>🗺️ 仕事の世界をのぞいてみよう</span><small>気になった仕事はタップして覚えておこう</small></div>
          <div class="seedMap">
            <div class="seedCard"><span>🤝</span><b>人を支える</b><p>先生・保育士・看護師・介護士・薬剤師・心理師</p></div>
            <div class="seedCard"><span>🛠️</span><b>つくる</b><p>大工・建築士・料理人・パティシエ・家具職人・整備士</p></div>
            <div class="seedCard"><span>💻</span><b>コンピューター</b><p>プログラマー・ゲームクリエイター・Webデザイナー・AIエンジニア</p></div>
            <div class="seedCard"><span>🔬</span><b>科学・研究</b><p>研究者・科学者・気象予報士・薬の研究者・宇宙開発</p></div>
            <div class="seedCard"><span>🎨</span><b>表現・デザイン</b><p>イラストレーター・漫画家・映像制作者・カメラマン・デザイナー</p></div>
            <div class="seedCard"><span>🎤</span><b>伝える・届ける</b><p>アナウンサー・記者・編集者・声優・通訳・広報</p></div>
            <div class="seedCard"><span>🌳</span><b>自然・動物</b><p>農家・林業・獣医師・動物飼育員・水族館スタッフ・環境保全</p></div>
            <div class="seedCard"><span>🚗</span><b>乗り物・まち</b><p>自動車整備士・運転士・パイロット・鉄道員・消防士・建設技術者</p></div>
            <div class="seedCard"><span>🛍️</span><b>お店・くらし</b><p>販売員・店長・美容師・服飾デザイナー・インテリアコーディネーター</p></div>
            <div class="seedCard"><span>🍳</span><b>食べ物</b><p>料理人・パン職人・栄養士・食品開発・農業技術者・飲食店経営</p></div>
            <div class="seedCard"><span>⚽</span><b>スポーツ・健康</b><p>スポーツ選手・コーチ・トレーナー・体育教師・理学療法士</p></div>
            <div class="seedCard"><span>🏛️</span><b>社会・まちをつくる</b><p>公務員・市役所職員・弁護士・建築士・まちづくり・国際協力</p></div>
          </div>

          <div class="seedQuestion"><strong>💡 こんなところにも仕事があるよ</strong><span>学校、病院、お店、工場、農家、会社、テレビ、インターネット、駅、市役所、博物館、スタジアム……。</span></div>
          <div class="seedAction"><span>🎯 気になった仕事を「3つ」選んでみよう。</span><small>「なぜ気になった？」まで考えると、自分の興味が見えてくるよ。</small></div>

          <div class="tags"></div><div class="jobs"></div>
        </section>'''

          s2, n = re.subn(r'<section class="explore">.*?</section>', new, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('explore section not found')

          css = r'''
          /* career seed explorer expansion */
          .seedIntro{margin-top:14px;background:#f7fbf8;border:1px solid var(--line);border-radius:15px;padding:13px}
          .seedIntroHead,.seedMapHead{display:flex;justify-content:space-between;gap:10px;align-items:center;color:var(--dark);font-weight:900;font-size:13px}
          .seedIntroHead small,.seedMapHead small{color:var(--muted);font-weight:700;font-size:11px}
          .seedWays{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
          .seedWay{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px;min-height:58px}
          .seedIcon{width:34px;height:34px;border-radius:10px;background:var(--mint);display:grid;place-items:center;flex:none;font-size:18px}
          .seedWay b{display:block;font-size:12px;color:var(--dark)}
          .seedWay small{display:block;color:var(--muted);font-size:10px;line-height:1.4;margin-top:1px}
          .seedMapHead{margin-top:16px}
          .seedMap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:9px}
          .seedCard{border:1px solid var(--line);background:#fff;border-radius:13px;padding:10px;min-height:104px;transition:transform .15s,box-shadow .15s,border-color .15s}
          .seedCard:active{transform:translateY(1px)}
          .seedCard>span{font-size:18px}
          .seedCard b{display:block;color:var(--dark);font-size:12px;margin-top:2px}
          .seedCard p{margin:3px 0 0;color:var(--muted);font-size:11px;line-height:1.45}
          .seedQuestion{display:flex;gap:8px;align-items:flex-start;margin-top:11px;background:var(--blue);border:1px solid #c7e2f0;border-radius:12px;padding:10px;font-size:11px}
          .seedQuestion strong{color:var(--dark);white-space:nowrap}
          .seedQuestion span{color:var(--muted)}
          .seedAction{margin-top:10px;background:linear-gradient(90deg,#fff4cf,#f7fbf8);border:1px solid #e9d78d;border-radius:13px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
          .seedAction span{font-size:13px;font-weight:900;color:var(--dark)}
          .seedAction small{font-size:11px;color:var(--muted);text-align:right}
          .explore>.tags{margin-top:13px}
          @media(max-width:900px){.seedWays{grid-template-columns:repeat(2,minmax(0,1fr))}.seedMap{grid-template-columns:repeat(3,minmax(0,1fr))}}
          @media(max-width:620px){.seedWays,.seedMap{grid-template-columns:repeat(2,minmax(0,1fr))}.seedIntroHead small,.seedMapHead small{display:none}.seedQuestion{display:block}.seedQuestion strong{display:block;margin-bottom:2px}.seedAction{display:block}.seedAction small{display:block;text-align:left;margin-top:3px}}
          '''
          marker='</style>'
          if '.seedIntro{' not in s2:
              s2=s2.replace(marker, css+'\n'+marker, 1)
          p.write_text(s2,encoding='utf-8')
          print('career seed explorer expanded')
          PY
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/career-navi-expand-jobs.yml
          git rm .github/workflows/career-navi-expand-jobs.yml
          git commit -m "Career Navi: 仕事の種を大幅拡充"
          git push
