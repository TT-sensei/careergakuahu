name: Expand career job explorer
on:
  push:
    paths:
      - '.github/workflows/career-navi-expand-jobs.yml'
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand job explorer
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          new='''<section class="explore" id="explore"><h2>🌱 仕事の種を探そう</h2><p class="sub">「好き」「得意」「やってみたい」から、気になる仕事を見つけてみよう。</p><div class="seedTabs" role="tablist"><button class="seedTab active" data-seed="好き">❤️ 好きなこと</button><button class="seedTab" data-seed="得意">⭐ 得意なこと</button><button class="seedTab" data-seed="したい">💭 やってみたい</button><button class="seedTab" data-seed="身近">🏫 身近な場所</button></div><div class="seedHint" id="seedHint">好きなことを選んでみよう。ぴったり同じ仕事じゃなくても大丈夫！</div><div class="seedChips" id="seedChips"></div><div class="seedJobs" id="seedJobs"></div><div class="seedPick">💡 気になった仕事を <strong>3つ</strong> 選んで、ワークシートにメモしてみよう。</div></section>'''
          pattern=r'<section class="explore"[^>]*>.*?</section>'
          s2,n=re.subn(pattern,new,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('explore section not found')
          css='''<style>.seedTabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.seedTab{border:1px solid var(--line);background:#fff;border-radius:13px;padding:11px 8px;font-weight:900;color:var(--dark);min-height:48px}.seedTab.active{background:var(--mint);border-color:#9bd3b2}.seedHint{margin-top:10px;padding:10px 12px;background:#f6fbf8;border-radius:12px;color:var(--muted);font-size:12px}.seedChips{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}.seedChip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;color:var(--dark);font-weight:800;font-size:12px}.seedChip.active{background:var(--green);border-color:var(--green);color:#fff}.seedJobs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-top:12px}.seedJob{border:1px solid var(--line);border-radius:13px;padding:11px;background:#fff}.seedJob small{color:var(--green);font-weight:900}.seedJob h4{margin:3px 0;font-size:15px}.seedJob p{margin:0;color:var(--muted);font-size:12px}.seedPick{margin-top:12px;background:var(--yellow);border:1px solid #f0dc8e;border-radius:13px;padding:11px 13px;font-size:13px;color:var(--dark)}@media(max-width:900px){.seedTabs{grid-template-columns:repeat(2,1fr)}.seedJobs{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:620px){.seedJobs{grid-template-columns:repeat(2,minmax(0,1fr))}}</style>'''
          s2=s2.replace('</head>',css+'</head>',1)
          js='''<script>(()=>{const data={好き:{hint:'「これが好き！」から探してみよう。',chips:{'ゲーム・コンピューター':['ゲームクリエイター','プログラマー','Webデザイナー','動画クリエイター'],'絵・ものづくり':['イラストレーター','デザイナー','建築士','家具職人'],'動物':['獣医師','動物飼育員','トリマー','水族館スタッフ'],'スポーツ':['スポーツ選手','スポーツトレーナー','体育教師','スポーツ記者'],'音楽・表現':['音楽家','声優','俳優','ダンサー'],'食べ物':['料理人','パティシエ','パン職人','食品開発者'],'自然・科学':['研究者','気象予報士','環境保全員','農家'],'人と話す':['教師','保育士','販売員','キャリアカウンセラー']}},得意:{hint:'「自分はこれが得意かも？」から探してみよう。',chips:{'考える・調べる':['研究者','記者','弁護士','プログラマー'],'人を助ける':['看護師','医師','介護福祉士','消防士'],'つくる・直す':['大工','整備士','技術者','製造技術者'],'伝える・表現する':['アナウンサー','デザイナー','編集者','教師'],'計算・数字':['税理士','会計士','銀行員','データサイエンティスト'],'体を動かす':['消防士','スポーツトレーナー','警察官','自衛官']}},したい:{hint:'「こんなことをしてみたい！」から探してみよう。',chips:{'人を笑顔にしたい':['教師','保育士','イベントプランナー','ホテルスタッフ'],'困っている人を助けたい':['医師','看護師','消防士','社会福祉士'],'新しいものをつくりたい':['発明家','研究者','エンジニア','商品開発者'],'自然を守りたい':['環境保全員','林業従事者','獣医師','気象予報士'],'町を便利にしたい':['都市計画技術者','建築士','公務員','鉄道運転士'],'世界で活躍したい':['外交官','通訳','国際協力スタッフ','パイロット']}},身近:{hint:'学校や町で見かける仕事から探してみよう。',chips:{'学校':['教師','学校事務','栄養教諭','スクールカウンセラー'],'病院・健康':['医師','看護師','薬剤師','理学療法士'],'お店':['販売員','店長','バイヤー','調理師'],'工場・会社':['製造技術者','品質管理','営業','会社員'],'町・公共施設':['市役所職員','警察官','消防士','図書館司書'],'駅・乗り物':['鉄道運転士','駅員','バス運転士','航空整備士'],'農地・自然':['農家','林業従事者','獣医師','造園家']}}};const tabs=[...document.querySelectorAll('.seedTab')],chips=document.getElementById('seedChips'),jobs=document.getElementById('seedJobs'),hint=document.getElementById('seedHint');let mode='好き',cat=Object.keys(data[mode].chips)[0];function render(){hint.textContent=data[mode].hint;chips.innerHTML=Object.keys(data[mode].chips).map(x=>`<button class="seedChip ${x===cat?'active':''}">${x}</button>`).join('');jobs.innerHTML=data[mode].chips[cat].map(j=>`<article class="seedJob"><small>仕事の例</small><h4>${j}</h4><p>どんな仕事か調べてみよう。</p></article>`).join('');chips.querySelectorAll('.seedChip').forEach((b,i)=>b.onclick=()=>{cat=Object.keys(data[mode].chips)[i];render()})}tabs.forEach(t=>t.onclick=()=>{mode=t.dataset.seed;cat=Object.keys(data[mode].chips)[0];tabs.forEach(x=>x.classList.toggle('active',x===t));render()});render()})();</script>'''
          s2=s2.replace('</body>',js+'</body>',1)
          p.write_text(s2,encoding='utf-8')
          PY
      - name: Commit result and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: 仕事の種を探そうを充実'
          git push
          rm -f .github/workflows/career-navi-expand-jobs.yml
          git add .github/workflows/career-navi-expand-jobs.yml
          git commit -m 'chore: remove temporary job explorer workflow'
          git push
