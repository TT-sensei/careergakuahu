name: Career Navi AI 567 adjustment
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  adjust:
    if: "!contains(github.event.head_commit.message, 'Career Navi: AIを5・6・7時間だけにする')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Limit AI guide to hours 5 6 7
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''<div class="ai-mini"><div class="aiHead"><strong>🤖 AIに質問してみよう</strong><button class="copy" onclick="copyPrompt(${i+1},this)">コピー</button></div><div class="prompt" id="prompt-${i+1}">「${l[0]}」について、小学生にもわかるようにヒントをください。事実と予想を分け、出典も示してください。</div></div>'''
          new = '''${[5,6,7].includes(i+1)?`<div class="ai-mini"><div class="aiHead"><strong>🤖 AIに質問してみよう</strong><button class="copy" onclick="copyPrompt(${i+1},this)">コピー</button></div><div class="prompt" id="prompt-${i+1}">「${l[0]}」について、小学生にもわかるようにヒントをください。事実と予想を分け、出典も示してください。</div></div>`:''}'''
          if old not in s:
              raise SystemExit('AI block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Career Navi: AIを5・6・7時間だけにする"
          git rm .github/workflows/career-navi-ai-only-567.yml
          git commit -m "chore: remove temporary AI adjustment workflow"
          git push
